# HTTP server for observability UI
mist = ">= 4.0.0"

# Database
sqlight = ">= 1.1.0 and < 2.0.0"
parrot = ">= 2.2.1 and < 3.0.0"
birl = ">= 1.7.1 and < 2.0.0"
gluid = ">= 1.0.0 and < 2.0.0"
logging = ">= 1.5.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
