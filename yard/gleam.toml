name = "yard"
version = "0.1.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
telemetry = ">= 1.0.0 and < 2.0.0"
chute = { path = "../chute" }
ballast = { path = "../ballast" }
gabsurd = { path = "../../gabsurd" }
